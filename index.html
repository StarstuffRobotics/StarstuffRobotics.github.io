<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starstuff Robotics | Portfolios</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent: #ffffff;
            --text-dim: #888888;
            --radius: 14px;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 50px 50px;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 60px;
            text-align: center;
            font-size: 1.8rem;
        }

        .portfolio-grid {
            display: grid;
            width: 100%;
            max-width: 1400px;
            /* Reactive grid: adapts columns based on screen width */
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 50px 30px;
            justify-content: center;
        }

        .item-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .canva-frame {
            position: relative;
            width: 100%;
            padding-top: 133.33%; 
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .canva-frame:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .canva-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .label {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            text-align: center;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .label:hover {
            color: var(--accent);
        }

        @media (max-width: 450px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Starstuff Starsets</h1>

    <div class="portfolio-grid">

            <div class="canva-frame">

            </div>
            <a class="label" href="https://www.canva.com/design/DAGg5dSDKRo/msaYDfhVs1xwePmAUze2mA/view" target="_blank">STEM Tutoring Lesson Plans</a>

        <div class="item-group">

            <a class="label" href="https://www.canva.com/design/DAG9mk7pixQ/VWEAv2ZDLBGWr9f4xYBn1Q/view" target="_blank">Brand Standards</a>

        <div class="item-group">
